[workspace]
resolver = "2"
members = [
  "rust/crates/deep-obsidian-algolia",
  "rust/crates/deep-obsidian-backend",
  "rust/crates/deep-obsidian-core",
  "rust/crates/deep-obsidian-cli",
  "rust/crates/deep-obsidian-config",
  "rust/crates/deep-obsidian-index",
  "rust/crates/deep-obsidian-server",
  "rust/crates/deep-obsidian-types",
]

[workspace.package]
# The release version, stamped into every crate. Reached by `CARGO_PKG_VERSION` in
# `deep-obsidian-cli` (`deep-obsidian-mcp version`) and used by cargo-deb as the
# default package version when `scripts/build-deb.sh` is called with no argument.
# The tag-driven release passes the tag version explicitly, so this value and the tag
# must agree — see docs/release-checklist.md.
#
# NOTE: the MCP `serverInfo.version` reported over the wire is deliberately NOT this
# value (it is a frozen literal in deep-obsidian-server/src/mcp.rs, asserted by
# tests/golden/initialize.json). Bumping here does not move that contract.
version = "0.2.0-alpha.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
# Ripgrep's OWN glob engine (`globset` is a crate of the ripgrep repository, used
# by `ignore` which rg walks with). The CouchDB backend's virtual grep has to make
# `--glob` mean exactly what it means on the ripgrep path, and `*`/`**`/`?`/`[a-z]`/
# `{a,b}`/escapes are far too much surface to reimplement from a spec — a
# hand-rolled matcher that quietly mishandles brace alternation is precisely how a
# faithful imitation becomes a lookalike. The heavier `ignore` crate was rejected:
# its `Override` matcher is rooted at the process CWD, which is the one ripgrep
# behaviour the virtual grep deliberately does NOT reproduce (see
# `virtual_grep::GlobFilter`), so it would cost walkdir + crossbeam for fidelity
# that is then discarded.
globset = "0.4"
hmac = "0.12"
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
    "vendored",
] }
notify = "6"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
urlencoding = "2"
zeroize = "1"
