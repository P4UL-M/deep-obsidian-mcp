[workspace]
resolver = "2"
members = [
  "rust/crates/deep-obsidian-algolia",
  "rust/crates/deep-obsidian-core",
  "rust/crates/deep-obsidian-cli",
  "rust/crates/deep-obsidian-config",
  "rust/crates/deep-obsidian-index",
  "rust/crates/deep-obsidian-server",
  "rust/crates/deep-obsidian-types",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hmac = "0.12"
# keyring v3 ships NO platform backend by default: without these features every
# operation silently hits the in-memory mock store (put "succeeds", the secret
# evaporates when the process exits, and the encrypted-file fallback never
# triggers because the mock does not error). apple-native = macOS Keychain;
# windows-native = Credential Manager; sync-secret-service (+ crypto-rust,
# vendored) = Linux Secret Service over D-Bus with no system libdbus build dep —
# headless Linux errors cleanly, which is what routes callers to the
# encrypted-file fallback.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
notify = "6"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
urlencoding = "2"
zeroize = "1"
