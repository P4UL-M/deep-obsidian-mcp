[package]
name = "deep-obsidian-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
# The typed Algolia REST client the algolia backend speaks through. Acyclic: the
# algolia crate depends on nothing in this workspace.
deep-obsidian-algolia = { path = "../deep-obsidian-algolia" }
deep-obsidian-core = { path = "../deep-obsidian-core" }
# Deliberate, and a widening of this crate's tree: the algolia backend builds the
# SAME chunk records the local indexer builds, so it calls `plan_note_chunks`,
# `note_title`, `extract_wiki_links` and `extract_heading_sections` rather than
# reimplementing them. Reimplementing is the one thing that must not happen — a
# chunk boundary that differed from the indexer's would make the shared corpus
# disagree with every local index built over the same notes. Acyclic (the index
# crate depends only on core), at the cost of pulling the index's native deps
# (rusqlite, sqlite-vec) into this crate's build.
deep-obsidian-index = { path = "../deep-obsidian-index" }
# The virtual grep reads its candidate notes with bounded concurrency
# (`buffered`, which preserves order so the scan stays deterministic). Already a
# workspace dependency of the server crate; no new external crate.
futures-util.workspace = true
# The CouchDB backend's virtual grep imitates ripgrep, so it compiles `--glob`
# patterns with ripgrep's own glob engine rather than a lookalike. See the
# workspace manifest for why `ignore` was not used instead.
globset.workspace = true
notify.workspace = true
rand.workspace = true
# The algolia backend's candidate-bounded grep evaluates the caller's pattern
# locally over fetched chunk text; the ripgrep-backed grep shells out instead.
regex.workspace = true
# Secrets reach the sidecar only through its `initialize` call. `SecretString`
# gives the credential struct a `Debug` that cannot print the value, so an
# accidental `{:?}` on a config struct cannot leak a password.
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The sidecar's stderr is drained to `debug!`. Already a workspace dependency
# used by the index and server crates; no new external crate.
tracing.workspace = true

[dev-dependencies]
# The couchdb integration suite drives the mock CouchDB fixture over JSON lines and
# builds credential structs; both are already workspace dependencies of this crate's
# dependents, so nothing new enters the tree.
secrecy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
