name: ci

# Minimal correctness gate for the Rust workspace. The .deb build matrix lives
# in release-deb.yml and already exercises release compilation on PRs touching
# `rust/**`; this workflow only runs the test suite and reports lint drift.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Blocking. The workspace manifest is at the repository root (members are
  # `rust/crates/*`), so cargo runs from the checkout root, not from `rust/`.
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two pre-existing grep_search tests spawn ripgrep; hosted runners
      # don't ship it.
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # `rust-toolchain.toml` declares rustfmt+clippy as required components;
      # the action installs the minimal profile by default, so request them
      # explicitly rather than letting rustup fetch them mid-build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The couchdb backend's integration suite drives the REAL sidecar bundle
      # against the mock CouchDB fixture. Those tests are deliberately not
      # `#[ignore]` (they are hermetic: a local HTTP server on an ephemeral port),
      # but they skip when `node` or `dist/sidecar.mjs` is absent -- and a silent
      # skip in CI is worse than an explicit ignore, because it is invisible. So the
      # bundle is built here, before the Rust suite runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sidecar/livesync-sidecar/package-lock.json
      - name: build the livesync sidecar bundle
        working-directory: sidecar/livesync-sidecar
        run: npm ci && npm run build
      - name: cargo test --workspace
        run: cargo test --workspace

  # Blocking, and deliberately NOT path-filtered to `sidecar/**`.
  #
  # The sidecar's stdio protocol is a contract the Rust supervisor codes
  # against, so a change on either side can break it. Running unconditionally
  # (the job takes well under a minute) means the protocol cannot rot behind a
  # filter that only fires when the TypeScript happens to change.
  sidecar:
    name: livesync sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar/livesync-sidecar
    steps:
      - uses: actions/checkout@v4
      # Node 20 is the package's declared minimum, so CI runs the floor rather
      # than the newest release: a Node-24-only API would otherwise slip in and
      # break users on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sidecar/livesync-sidecar/package-lock.json
      # `ci`, not `install`: the lockfile is the pin. `@vrtmrz/livesync-commonlib`
      # is pre-1.0 with "not final" semantics, so an unintended float is a real
      # risk, not a hypothetical one.
      - run: npm ci
      - run: npm run typecheck
      # Build before test: the suite drives `dist/sidecar.mjs` as a child
      # process on purpose, and fails loudly if it is missing.
      - run: npm run build
      - run: npm test

  # Path filter for the `docker` job below, hand-rolled rather than delegated to a
  # third-party filter action: it is fifteen lines, it needs no new dependency in a
  # workflow that can build and run a container image, and `git diff` is auditable.
  #
  # A push to `main` (or a manual run) always says yes: the filter's job is to spare
  # a docs-only PR a ten-minute image build, not to let `main` go unbuilt.
  docker-changes:
    name: docker paths changed?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: building"
            exit 0
          fi
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(Dockerfile|\.dockerignore|docker-compose\.example\.yml|docker/|rust/|sidecar/|scripts/docker-smoke-test\.sh|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no image-relevant paths changed: skipping the docker job"
          fi

  # The container image, built natively on both architectures and then smoke-tested.
  #
  # # Why a matrix of two runners rather than one buildx `platforms:` list
  #
  # `linux/amd64,linux/arm64` from a single runner means QEMU for one of them, and
  # QEMU means a Rust release build at roughly a tenth of native speed — for this
  # workspace, tens of minutes — plus emulation bugs that surface as mysterious
  # SIGILLs in dependency build scripts. Two native runners build in parallel, each
  # in its own cache scope, and each RUNS the image it just built. That last part is
  # the decisive one: a cross-built image cannot be smoke-tested on the builder, and
  # an image nobody ran is an image nobody has checked.
  #
  # Nothing is pushed anywhere. The publish step is commented out below and waits on
  # the release decision; see docs/release-checklist.md.
  docker:
    name: docker image (${{ matrix.runner }})
    needs: docker-changes
    if: needs.docker-changes.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Loaded into the runner's daemon rather than pushed: the smoke test below
          # runs the image. Single-arch (this runner's own), so `load` is valid.
          load: true
          push: false
          tags: deep-obsidian-mcp:ci
          build-args: |
            VCS_REF=${{ github.sha }}
          # One scope per runner. A shared scope would have the two architectures
          # overwrite each other's layer index on every run, so both would keep
          # missing.
          cache-from: type=gha,scope=docker-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.runner }}
      - name: image size
        run: |
          docker image inspect deep-obsidian-mcp:ci \
            --format 'bytes={{.Size}} platform={{.Os}}/{{.Architecture}} user={{.Config.User}}'
      # The parity smoke test: the same assertions scripts/linux-smoke-test.sh makes
      # about the .deb (binary, ripgrep, the sidecar bundle located by the binary's
      # OWN probe from `/`, health, MCP initialize, stdio), plus the entrypoint
      # contract (auth refusal, the explicit insecure escape hatch, mounted-config
      # precedence) and a live-CouchDB degraded-start/self-heal proof.
      - name: parity smoke test
        run: scripts/docker-smoke-test.sh deep-obsidian-mcp:ci

      # ---------------------------------------------------------------------
      # Publishing to GHCR — deliberately commented out until releases resume.
      # ---------------------------------------------------------------------
      # Tag policy, matching the .deb channel: `vX.Y.Z` from the tag plus `latest`,
      # and NOTHING from a branch or a PR. Publishing needs `packages: write` added
      # to this workflow's permissions, and a multi-arch push means building both
      # architectures on their own runner and joining them into one manifest list
      # (docker/metadata-action + a `merge` job), because `load: true` above is
      # single-arch by construction.
      #
      # - name: log in to ghcr.io
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      # - name: push ${{ github.ref_name }} and latest
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     push: true
      #     tags: |
      #       ghcr.io/p4ul-m/deep-obsidian-mcp:${{ github.ref_name }}
      #       ghcr.io/p4ul-m/deep-obsidian-mcp:latest
      #     cache-from: type=gha,scope=docker-${{ matrix.runner }}

  # Informational ONLY (`continue-on-error: true`), deliberately not a gate:
  #
  #   * `main` carries pre-existing clippy warnings (34 lint sites at the time
  #     this workflow was added). Making clippy blocking would fail every PR
  #     until that backlog is cleared, which is out of scope here.
  #   * `cargo fmt --check` output is rustfmt-version dependent and the tree
  #     has known formatting drift, so a hosted-runner rustfmt disagrees with
  #     locally formatted files for reasons unrelated to the PR.
  #
  # The job still runs so the annotations are visible and the trend can be
  # watched; flip `continue-on-error` off once both are clean.
  lint:
    name: fmt + clippy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Both steps carry `continue-on-error` individually, not just the job:
      # a failing step normally aborts the remaining steps, which would hide
      # the clippy output behind the (currently guaranteed) fmt failure.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all --check
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features
