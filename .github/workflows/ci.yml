name: ci

# Minimal correctness gate for the Rust workspace. The .deb build matrix lives
# in release-deb.yml and already exercises release compilation on PRs touching
# `rust/**`; this workflow only runs the test suite and reports lint drift.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Blocking. The workspace manifest is at the repository root (members are
  # `rust/crates/*`), so cargo runs from the checkout root, not from `rust/`.
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two pre-existing grep_search tests spawn ripgrep; hosted runners
      # don't ship it.
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # `rust-toolchain.toml` declares rustfmt+clippy as required components;
      # the action installs the minimal profile by default, so request them
      # explicitly rather than letting rustup fetch them mid-build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The couchdb backend's integration suite drives the REAL sidecar bundle
      # against the mock CouchDB fixture. Those tests are deliberately not
      # `#[ignore]` (they are hermetic: a local HTTP server on an ephemeral port),
      # but they skip when `node` or `dist/sidecar.mjs` is absent -- and a silent
      # skip in CI is worse than an explicit ignore, because it is invisible. So the
      # bundle is built here, before the Rust suite runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sidecar/livesync-sidecar/package-lock.json
      - name: build the livesync sidecar bundle
        working-directory: sidecar/livesync-sidecar
        run: npm ci && npm run build
      - name: cargo test --workspace
        run: cargo test --workspace

  # Blocking, and deliberately NOT path-filtered to `sidecar/**`.
  #
  # The sidecar's stdio protocol is a contract the Rust supervisor codes
  # against, so a change on either side can break it. Running unconditionally
  # (the job takes well under a minute) means the protocol cannot rot behind a
  # filter that only fires when the TypeScript happens to change.
  sidecar:
    name: livesync sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar/livesync-sidecar
    steps:
      - uses: actions/checkout@v4
      # Node 20 is the package's declared minimum, so CI runs the floor rather
      # than the newest release: a Node-24-only API would otherwise slip in and
      # break users on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sidecar/livesync-sidecar/package-lock.json
      # `ci`, not `install`: the lockfile is the pin. `@vrtmrz/livesync-commonlib`
      # is pre-1.0 with "not final" semantics, so an unintended float is a real
      # risk, not a hypothetical one.
      - run: npm ci
      - run: npm run typecheck
      # Build before test: the suite drives `dist/sidecar.mjs` as a child
      # process on purpose, and fails loudly if it is missing.
      - run: npm run build
      - run: npm test

  # Informational ONLY (`continue-on-error: true`), deliberately not a gate:
  #
  #   * `main` carries pre-existing clippy warnings (34 lint sites at the time
  #     this workflow was added). Making clippy blocking would fail every PR
  #     until that backlog is cleared, which is out of scope here.
  #   * `cargo fmt --check` output is rustfmt-version dependent and the tree
  #     has known formatting drift, so a hosted-runner rustfmt disagrees with
  #     locally formatted files for reasons unrelated to the PR.
  #
  # The job still runs so the annotations are visible and the trend can be
  # watched; flip `continue-on-error` off once both are clean.
  lint:
    name: fmt + clippy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Both steps carry `continue-on-error` individually, not just the job:
      # a failing step normally aborts the remaining steps, which would hide
      # the clippy output behind the (currently guaranteed) fmt failure.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all --check
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features
